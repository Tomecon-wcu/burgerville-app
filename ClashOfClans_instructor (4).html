<style>
  /* Layout: instructor.html's pattern — games list → game detail with grouped action cards → one screen per task,
     each with a back link. Same Burgerville tokens as the student app. */
  html { font-size: 17px; }
  :root {
    --bg: #FAF6EE; --panel: #ffffff; --ink: #1a1a2e; --muted: #5a5a72; --border: #e0dbd0;
    --paper-line: #E4DCC8; --rust: #A6491F; --rust-dark: #7E3517; --sage: #5B7553; --gold: #B98A2E;
    --new-eq: #1d7a3a; --demand: #b03a2e; --supply: #2563a8;
    --given-bg: #EAF1F7; --given-border: #b9cfe0; --edit-bg: #EAF6EC; --edit-border: #a9d4ae;
    --warn-bg: #FBF3E3; --good-bg: #F3F7F1; --bad-bg: #FBEEEC; --tint: #f0ece0;
    --shadow: 0 4px 24px rgba(26,26,46,0.10); --radius: 12px;
    --serif: Georgia, "Iowan Old Style", serif;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {

    background-color: var(--bg);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    padding-block: 18px 60px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .mock-banner { margin-bottom: 12px; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--gold); border-radius: 8px; padding: 8px 12px; }
  .mock-banner b { color: var(--rust); }
  .mock-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .mock-nav button { font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--gold); background: var(--warn-bg); color: var(--ink); cursor: pointer; }
  .mock-nav button.on { background: var(--gold); color: #fff; }

  header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  header.top h1 { font-family: var(--serif); font-size: 26px; margin: 0; }

  .lede { color: var(--muted); font-size: 15px; margin: 0 0 16px; }

  .card { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 16px 18px; min-width: 0; }
  .card h3 { font-family: var(--serif); font-size: 1.05rem; margin: 0 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 7px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .card h3 .aside { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .note { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .btn { font-family: var(--sans); font-size: 15px; font-weight: 700; border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1.5px solid var(--rust-dark); background: var(--rust); color: #fff; }
  .btn.secondary { background: var(--panel); color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .btn.sage { background: var(--sage); border-color: var(--sage); }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 2px 9px; }
  .pill.open { background: var(--warn-bg); color: var(--rust); border: 1px solid var(--gold); }
  .pill.arch { background: #EDE8DA; color: var(--muted); }

  .game-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px dashed var(--paper-line); cursor: pointer; flex-wrap: wrap; }
  .game-row:hover { background: var(--warn-bg); }
  .game-row .nm { font-weight: 700; font-size: 16px; }
  .game-row .meta { font-size: 13px; color: var(--muted); }

  .action { display: flex; flex-direction: column; gap: 8px; }
  .action .t { font-family: var(--serif); font-weight: 700; font-size: 16px; }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin: 6px 0 -6px; }
  .progress { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }

  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
  table.t td { padding: 6px 6px; border-bottom: 1px dashed var(--paper-line); font-variant-numeric: tabular-nums; vertical-align: middle; }
  table.t .num { text-align: right; }
  table.t tr.flag td { background: var(--bad-bg); }
  .scroll-x { overflow-x: auto; }
  .neg { color: var(--demand); } .over { color: var(--demand); font-weight: 700; } .under { color: var(--sage); font-weight: 700; }
  select, input[type=text], input[type=number], textarea { font-family: var(--sans); font-size: 14px; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--ink); max-width: 100%; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 13px; font-weight: 700; }
  .field .h { font-size: 12px; color: var(--muted); }
  .field input { width: 100%; }
  .field input.edit { background: var(--edit-bg); border-color: var(--edit-border); text-align: right; font-variant-numeric: tabular-nums; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }

  .clan-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .clan-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .clan-box .n { font-weight: 700; }
  .clan-box .c { font-size: 13px; color: var(--muted); }
  .clan-box input { width: 100%; margin-top: 6px; }

  .subnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .subnav button { font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--sage); background: var(--good-bg); color: var(--sage); cursor: pointer; }
  .subnav button.on { background: var(--rust); border-color: var(--rust-dark); color: #fff; }

  .chat-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  @media (max-width: 760px) { .chat-layout { grid-template-columns: 1fr; } }
  .chan { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .chan.on { background: var(--warn-bg); font-weight: 700; }
  .chan .cnt { font-size: 12px; color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; }
  .msg { padding: 8px 0; border-bottom: 1px dashed var(--paper-line); display: flex; gap: 10px; align-items: flex-start; }
  .msg .body { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; }
  .msg .who { font-size: 12px; color: var(--muted); }
  .msg .who b { color: var(--ink); }
  .msg.hidden .text { text-decoration: line-through; color: var(--muted); }
  .msg .acts { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

  svg text { font-family: var(--sans); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .vote-mini { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .clock { font-variant-numeric: tabular-nums; }
  .pace-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .pace-row { grid-template-columns: 1fr; } }
  .pace { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
  .pace:has(input:checked) { border-color: var(--rust); background: var(--warn-bg); }
  .unit-row { display: flex; gap: 6px; }
  .unit-row input { width: 80px; }
  .small-in { width: 56px; text-align: right; display: inline-block; padding: 3px 6px; }
  .scale-out { font-size: 14px; background: var(--good-bg); border: 1px solid var(--sage); border-radius: 8px; padding: 8px 12px; }
  .live-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .big-clock { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--rust); line-height: 1.1; }
  .live-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .round-dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .round-dots span { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--tint); color: var(--muted); }
  .round-dots span.done { background: var(--sage); color: #fff; }
  .round-dots span.cur { background: var(--rust); color: #fff; }
  .projector { position: fixed; inset: 0; z-index: 50; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .projector[hidden] { display: none; }
  .proj-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }
  .proj-round { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .proj-phase { font-family: var(--serif); font-size: clamp(36px, 7vw, 72px); font-weight: 700; }
  .proj-clock { font-size: clamp(72px, 18vw, 200px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .proj-sub { font-size: clamp(18px, 2.5vw, 28px); opacity: .85; }
  .mm-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: center; }
  @media (max-width: 700px) { .mm-top { grid-template-columns: minmax(0, 1fr); } }
  .mm-lead { background: var(--ink); color: #fff; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .ml-k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); font-weight: 700; }
  .ml-v { font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1.25; }
  .ml-n { font-size: 13px; opacity: .8; }
  .mm-bars { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .mrow { display: grid; grid-template-columns: 170px minmax(0, 1fr) 28px; gap: 10px; align-items: center; color: var(--muted); }
  .mrow.top { color: var(--ink); font-weight: 700; }
  .mrow .tn { text-align: right; font-variant-numeric: tabular-nums; }
  .mm-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .mm-feed { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .fmsg { font-size: 13px; background: var(--tint); border-radius: 8px; padding: 5px 10px; }
  .proj-mm { margin-top: 18px; font-family: var(--serif); font-size: clamp(22px, 3.2vw, 40px); }
  .pm-k { font-family: var(--sans); font-size: .5em; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); display: block; }
  .pm-n { font-family: var(--sans); font-size: .5em; opacity: .7; }

  /* ---------- projector display: a single dark look, built for a classroom screen ---------- */
  .pres { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #12121f; color: #f4f1ea; font-family: var(--sans);
    padding: max(14px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  .pres[hidden] { display: none; }
  .pres-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid #2c2c44; }
  .pt-game { font-size: 15px; color: #a9a6b8; }
  .pt-round { font-family: var(--serif); font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; }
  .pt-phase { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 14px; border-radius: 20px; background: #2c2c44; color: #E8C26A; }
  .pres-main { flex: 1; min-height: 0; display: grid; gap: 24px; padding: 18px 0; overflow: auto; align-items: start; }
  .pres-main.two { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); }
  .pres-main.res { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 900px) { .pres-main.two, .pres-main.res { grid-template-columns: minmax(0, 1fr); } }
  .pcol { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .p-k { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #E8C26A; }
  .p-title { font-family: var(--serif); font-size: clamp(28px, 3.6vw, 52px); font-weight: 700; line-height: 1.1; }
  .p-news { font-size: clamp(18px, 1.9vw, 26px); line-height: 1.45; background: #1d1d30; border-left: 4px solid #E8C26A; padding: 14px 18px; border-radius: 6px; }
  .p-note { font-size: clamp(15px, 1.4vw, 19px); color: #c9c5d6; line-height: 1.45; }
  .p-panel { background: #1b1b2d; border: 1px solid #2c2c44; border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .p-panel h4 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #a9a6b8; }
  .p-clock { font-size: clamp(90px, 15vw, 220px); font-weight: 800; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
  .p-clock.low { color: #ff7a66; }
  .p-clock.up { color: #E8C26A; font-size: clamp(52px, 6.5vw, 116px); white-space: nowrap; }
  .p-big { font-size: clamp(54px, 7vw, 110px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .p-sub { font-size: clamp(16px, 1.6vw, 22px); color: #c9c5d6; }
  .p-stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .p-stat { background: #1b1b2d; border: 1px solid #2c2c44; border-radius: 10px; padding: 10px 14px; }

  .p-bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: clamp(15px, 1.4vw, 19px); margin: 8px 0; }
  .p-bar .track { height: 16px; background: #2c2c44; border-radius: 8px; overflow: hidden; }

  .p-bar .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

  .p-lb { width: 100%; border-collapse: collapse; font-size: clamp(15px, 1.4vw, 19px); }

  /* market-message cloud */
  .cloud { position: relative; min-height: 360px; display: flex; flex-direction: column; gap: 14px; }
  .phrases { display: flex; flex-direction: column; gap: 4px; }

  .phrase .c { font-family: var(--sans); font-size: .42em; font-weight: 700; color: #a9a6b8; margin-left: 10px; vertical-align: middle; }
  .phrase.lead { color: #F4D58D; }

  .chip b { font-weight: 700; }

  @keyframes pop { from { transform: scale(.4) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .chip { animation: none; } .p-bar .fill, .p-progress > div, .phrase { transition: none; } }
  .p-svg { width: 100%; height: auto; display: block; }
  /* instructor control strip */

  .pres-ctl .hint { font-size: 12px; color: #8f8ca3; }

<script>
/* Clash of Clans instructor page. Everything goes through owner-checked database functions. */
const SUPABASE_URL = 'https://oxhojojzwvnfzsfpybyf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94aG9qb2p6d3ZuZnpzZnB5YnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTQzNTksImV4cCI6MjEwMDI3MDM1OX0.USn_IYs5LUBi8xk0kzR85l-miSiMH8U0soms7QzZpmk';
// Its own storageKey, so this session never collides with a student or Burgerville session.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'coc-instructor-auth' } });

const $ = id => document.getElementById(id);

const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const price = n => '$' + Number(n).toFixed(2);

const MKT_KEYS = ['cut2', 'cut', 'pat', 'up', 'up2'];
const CLAN_BANK = ['Iron Grill', 'Patty Kings', 'Smokestack', 'Bun Brigade', 'Brisket Barons', 'Sizzle Syndicate', 'Charcoal Crown', 'Ember Order', 'Cast Iron Guild', 'Mesquite Mob', 'Prime Cut Pact', 'Hickory House', 'Searing Circle', "Butcher's Block", 'Sesame Sovereigns', 'Rib Rack Republic', 'Grillfire Legion', 'Marrow Union', 'Skillet Senate', 'Flame Broil Federation'];

const CC_GROUPS = [['plan', 'Our plan'], ['others', 'Other clans'], ['clan', 'Our clan']];
const CC_DEFAULT = { plan: ['I think we should cut our plan.', "Let's keep our plan where it is.", 'I think we should raise our plan.', 'A bigger cut would raise the price more.'],
  others: ["The other clans won't cut, so why should we?", 'If we cut alone, the other clans gain.', 'Check the market messages before you vote.', 'Demand changed this round. Check the chart.'],
  clan: ['We lost money last round. We need a change.', "Last round went well. Let's stay the course.", 'Too many of us stole last round.', 'Please stick to the plan this time.'] };
let screen = 'signin', gameId = null, G = null, home = null, pendingEmail = '', clockOffset = 0, pollTimer = null;
let panelHtml = '', editRound = null, showBench = false, resPane = 'market', resRound = null, RES = null, chatClan = null, editPlayer = null, lastFetchAt = 0, autoRanKey = null;

// Inside the display while it's open: fullscreen shows only that element.
function toast(msg) { const t = $('toast'); (typeof presOpen !== 'undefined' && presOpen ? $('pres') : document.body).appendChild(t); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 6000); }
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; }
async function act(name, args, after) {
  try { const d = await rpc(name, { p_game: gameId, ...(args || {}) }); if (after) await after(d); await loadGame(); return d; }
  catch (e) { toast(e.message || 'That did not go through. Please try again.'); return undefined; }
}
function U() { return G && G.game.pace === 'over_days' ? 'Season' : 'Round'; }
function u() { return U().toLowerCase(); }
function clockText(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p2 = x => String(x).padStart(2, '0');
  return d ? `${d}d ${h}:${p2(m)}:${p2(s)}` : h ? `${h}:${p2(m)}:${p2(s)}` : `${m}:${p2(s)}`;
}
function secsLabel(sec) { return sec % 86400 === 0 ? (sec / 86400) + (sec === 86400 ? ' day' : ' days') : sec % 3600 === 0 ? (sec / 3600) + (sec === 3600 ? ' hour' : ' hours') : sec % 60 === 0 ? (sec / 60) + (sec === 60 ? ' minute' : ' minutes') : sec + ' seconds'; }
function header(back, title, lede) {
  return `<div><button class="back" data-nav="${back}" type="button">← ${back === 'games' ? 'All games' : esc(gameTitle())}</button>
    <h2 class="ttl">${esc(title)}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}</div>`;
}
function gameTitle() { return G ? G.game.name + (G.game.session_label ? ' · ' + G.game.session_label : '') : ''; }

/* ---------- sign-in: the same emailed code as the Burgerville instructor page ---------- */
function showSignIn(msg) {
  screen = 'signin'; stopPoll(); $('acct').hidden = true;
  app().innerHTML = `<div class="card signin"><h3>Instructor sign-in</h3><form id="emailForm" class="stack" style="gap:8px">

  $('emailForm').addEventListener('submit', async e => {
    e.preventDefault();
    pendingEmail = $('email').value.trim(); $('sendBtn').disabled = true; $('signMsg').textContent = 'Sending…';

}
function showCode(msg) {
  app().innerHTML = `<div class="card signin"><h3>Enter your code</h3><form id="codeForm" class="stack" style="gap:8px">

    $('signMsg').textContent = 'Verifying…';

}

/* ---------- navigation ---------- */

  stopPoll();

}

}
async function openGame(id) { gameId = id; panelHtml = ''; screen = 'detail'; await loadGame(); startPoll(); window.scrollTo(0, 0); }

}

  if (!gameId) return;
  lastFetchAt = Date.now();

  // Auto-run: this open page runs the round when the firm decision timer ends, if that setting is on.
  if (G.game.auto_run && G.phase === 'wait' && autoRanKey !== gameId + G.current) { autoRanKey = gameId + G.current; try { await rpc('coc_run_round', { p_game: gameId }); G = await rpc('coc_game_state', { p_game: gameId }); } catch (e) { toast(e.message); } }

function typing() { const a = document.activeElement; return a && a.matches && a.matches('input[type=text],input:not([type]),textarea,select') && app().contains(a); }

/* ---------- games list ---------- */

/* ---------- game page ---------- */

  }

  const canUndo = cur && ph === 'ran';

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if (row.some(x => x.trim())) rows.push(row);
  if (!rows.length) return [];
  const heads = rows[0].map(h => h.replace(/^﻿/, '').trim().toLowerCase().replace(/[\s_]+/g, ''));
  return rows.slice(1).map(r => { const o = {}; heads.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o; });
}

function drawRoundPreview() {
  const Q0 = parseNum($('sQ0').value), b = parseNum($('sB').value), c = parseNum($('sC').value), N = Math.max(1, G.signed_in), K = Math.max(1, (G.clans || []).length);
  const F = $('sF').value.trim() ? parseNum($('sF').value) : Number(G.game.market_fixed_cost) / N;
  if (!b || !Q0) return;
  const rows = [['Cooperative', (Q0 - b * c) / 2], [`${K} clans compete`, K * (Q0 - b * c) / (K + 1)], [`${N} players compete`, N * (Q0 - b * c) / (N + 1)], ['Competitive', Q0 - b * c]]
    .map(([nm, Q]) => { const P = Math.max(0, (Q0 - Q) / b); return [nm, Q, P, (P - c) * Q / N - F]; });
  if (showBench) $('benchRows').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="num">${fmt(r[1])}</td><td class="num">${price(r[2])}</td><td class="num ${r[3] < 0 ? 'neg' : ''}">${money(r[3])}</td></tr>`).join('');
  const L = 54, R = 440, T = 14, B = 220, qMax = Q0 * 1.05, pMax = Q0 / b * 1.08;
  const x = q => L + q / qMax * (R - L), y = p => B - p / pMax * (B - T);
  let h = `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="var(--muted)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="var(--muted)"/>`;
  for (let p = 0; p <= pMax; p += 5) h += `<text x="${L - 6}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">$${p}</text><line x1="${L}" x2="${R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--paper-line)"/>`;
  for (let q = 0; q <= qMax; q += 10e9) h += `<text x="${x(q)}" y="${B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${q / 1e9}B</text>`;
  h += `<text x="${(L + R) / 2}" y="${B + 34}" text-anchor="middle" font-size="11" fill="var(--muted)">Total output (lb)</text>`;
  h += `<line x1="${x(0)}" y1="${y(Q0 / b)}" x2="${x(Q0)}" y2="${y(0)}" stroke="var(--demand)" stroke-width="2.5"/>`;
  h += `<line x1="${L}" x2="${R}" y1="${y(c)}" y2="${y(c)}" stroke="var(--supply)" stroke-width="2" stroke-dasharray="6 4"/><text x="${R}" y="${y(c) - 6}" text-anchor="end" font-size="11" fill="var(--supply)">MC = ${price(c)}</text>`;
  const colors = ['var(--new-eq)', 'var(--gold)', 'var(--rust)', 'var(--supply)'], short = ['Coop', `${K} clans`, `${N} players`, 'Comp'];
  if (showBench) rows.forEach((r, i) => { h += `<circle cx="${x(r[1])}" cy="${y(r[2])}" r="5" fill="${colors[i]}" stroke="var(--panel)" stroke-width="1.5"/><text x="${x(r[1]) + 8}" y="${y(r[2]) - 6 - (i === 2 ? 12 : 0)}" font-size="11" font-weight="700" fill="${colors[i]}">${esc(short[i])}</text>`; });
  $('demandSvg').innerHTML = h;
}
